name: Deploy OpenDICOM Sirius RIS (Docker Compose)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Update existing stack, roll back, or operate it (down stops without removal)'
        required: true
        default: 'up -d'
        type: choice
        options:
          - 'up -d'
          - 'up -d --build'
          - 'rollback'
          - 'restart'
          - 'down'
          - 'ps'
          - 'pull'
      target_service:
        description: 'Optional service; rollback and down require an empty value'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: sirius-ris-production-compose
  cancel-in-progress: false

jobs:
  deploy:
    name: Update / Roll Back Existing Docker Compose Deployment
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 60
    steps:
      # The original checkout can hold live MongoDB bind mounts. Never clean it.
      - name: Checkout deployment tools in a separate directory
        uses: actions/checkout@v4
        with:
          path: .ris-ci-source
          clean: false
          persist-credentials: false

      - name: Verify deployment helper
        run: python3 -B -m unittest discover -s .ris-ci-source/tests -p 'test_deploy_compose.py'

      - name: Update existing deployment or perform requested operation
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          TARGET_SERVICE: ${{ inputs.target_service }}
          RIS_BUILD_SOURCE: 'true'
          SIRIUS_LANGUAJE: 'id'
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          DOCKER_COMPOSE_ENV: ${{ secrets.DOCKER_COMPOSE_ENV }}
          RIS_DEPLOY_STATE_DIR: ${{ vars.RIS_DEPLOY_STATE_DIR }}
        run: python3 .ris-ci-source/scripts/deploy_compose.py
