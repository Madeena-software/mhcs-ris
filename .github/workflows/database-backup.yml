name: "OpenDICOM RIS — Database Backup"

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Days of backups to keep on host'
        required: false
        default: '7'
        type: string

jobs:
  backup-mongodb:
    name: Backup Sirius MongoDB
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 15

    steps:
      - name: Create Database Backup via Docker
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="./database/backups"
          mkdir -p "$BACKUP_DIR"

          echo "Dumping MongoDB from container opendicom_sirius_database..."
          docker exec opendicom_sirius_database mongodump --out="/backups/dump_${TIMESTAMP}" || {
            echo "Failed running mongodump inside container. Checking container status..."
            docker ps --filter "name=opendicom_sirius_database"
            exit 1
          }

          echo "Compressing backup..."
          tar -czf "${BACKUP_DIR}/sirius_db_${TIMESTAMP}.tar.gz" -C "$BACKUP_DIR" "dump_${TIMESTAMP}"
          rm -rf "${BACKUP_DIR}/dump_${TIMESTAMP}"

          echo "Backup created successfully: ${BACKUP_DIR}/sirius_db_${TIMESTAMP}.tar.gz"
          ls -lh "${BACKUP_DIR}/sirius_db_${TIMESTAMP}.tar.gz"

          # Retention purge
          find "$BACKUP_DIR" -type f -name "sirius_db_*.tar.gz" -mtime +"${{ inputs.retention_days }}" -delete || true
